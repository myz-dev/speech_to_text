[workspace]
resolver = "3"
members = ["crates/apps/*", "crates/libs/*"]
# Root commands (build, test, run) cover the app and the libraries. The `stt` prototype
# is built only on request: `-p prototype`.
default-members = ["crates/apps/dictate", "crates/libs/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Internal
recording = { path = "crates/libs/recording" }
transcription = { path = "crates/libs/transcription" }
cleanup = { path = "crates/libs/cleanup" }
eval = { path = "crates/libs/eval" }

# External
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
hound = "3.5.1"
# Release candidate: its API changes between rc versions, so pin the exact version.
ort = "=2.0.0-rc.14"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
# Tauri 3 alphas are on crates.io; these requirements keep cargo on 2.x.
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-global-shortcut = "2.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
# Ollama is plain HTTP on localhost: no TLS or gzip needed.
ureq = { version = "3.4.2", default-features = false, features = ["json"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }

# whisper.cpp (ggml) and the resampler are unusably slow unoptimized, which would make
# debug builds (`cargo tauri dev`) misleading. Our own code stays at opt-level 0.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.realfft]
opt-level = 3
